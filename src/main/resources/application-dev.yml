spring:
  datasource:
    # connectionTimeZone: ให้ไดรเวอร์แปลง Instant <-> DATETIME เป็นเวลาไทยเสมอ ไม่ขึ้นกับ timezone ของ JVM
    # createDatabaseIfNotExist: สร้าง database ให้ถ้ายังไม่มี (สะดวกตอน dev ไม่ควรใช้บน production)
    url: jdbc:mariadb://localhost:3306/spring_data_jpa_demo2?connectionTimeZone=Asia/Bangkok&createDatabaseIfNotExist=true
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: a1234
    hikari:
      maximum-pool-size: 3
      minimum-idle: 2
      connection-timeout: 30000
      auto-commit: true

  # ให้ Spring Boot รัน src/main/resources/schema.sql ทุกครั้งที่ start (ใช้ CREATE TABLE IF NOT EXISTS ข้อมูลเดิมไม่หาย)
  sql:
    init:
      mode: always

  jpa:
    # none = Hibernate ไม่สร้าง/แก้ตารางเอง ใช้ schema.sql แทน
    # (ค่าอื่น: validate = ตรวจว่า entity ตรงกับตาราง, update = แก้ตารางให้ตาม entity, create-drop = สร้างใหม่ทุกครั้ง)
    hibernate:
      ddl-auto: none

    # false = ปิดการเปิด EntityManager ค้างไว้ตลอด web request
    # ต้องโหลดข้อมูล (รวมถึง lazy field) ให้ครบใน service/transaction ไม่งั้นได้ LazyInitializationException
    # ถ้าไม่ตั้งค่านี้ Spring Boot จะเปิดไว้ (true) และขึ้น warning ตอน start
    open-in-view: false

    properties:
      hibernate:
        # Hibernate เก็บ Instant เป็นเวลา UTC เป็นค่าเริ่มต้น (DB จะเห็นเวลาช้ากว่าไทย 7 ชั่วโมง)
        # TIMESTAMP = ส่งต่อให้ไดรเวอร์แปลงตาม connectionTimeZone=Asia/Bangkok เหมือนเวอร์ชัน JdbcClient
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        # ส่ง INSERT/UPDATE เป็นชุด ทีละ 50 คำสั่ง (ใช้ได้เพราะ order_id ไม่ใช่ AUTO_INCREMENT)
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # จัดรูปแบบ SQL ใน log ให้อ่านง่าย (เปิด log ด้วย logger org.hibernate.SQL ใน logback-spring.xml)
        format_sql: true

# extra config
app-config:
  # proxy settings
  main:
    name: test Name
    proxy-host: proxy.example.com
    proxy-port: 8080
    proxy-username: proxyuser
    proxy-password: proxypass
  db:
    db1-url: jdbc:mysql://localhost:3306/db1
    db1-driver-class-name: org.mariadb.jdbc.Driver
    db1-username: user1
    db1-password: password1
  schedule:
    cron-run3: "0 0 0 * * MON,WED,FRI"
